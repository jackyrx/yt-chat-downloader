[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-chat-downloader"
version = "0.0.2"
description = "Download YouTube live chat replays and comments"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Dev Maker", email = "dev.maker@example.com"}
]
keywords = ["youtube", "chat", "downloader", "live-chat", "comments", "yt-dlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "click>=8.0.0",
    "requests>=2.25.0",
    "yt-dlp>=2023.1.1",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/yt-chat-downloader"
Repository = "https://github.com/yourusername/yt-chat-downloader"
Issues = "https://github.com/yourusername/yt-chat-downloader/issues"

[project.scripts]
yt-chat-downloader = "yt_chat_downloader.__main__:main"

[tool.setuptools]
packages = ["yt_chat_downloader"]

[tool.setuptools.package-data]
yt_chat_downloader = ["py.typed"]

